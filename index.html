<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d1f" />
    <meta name="description" content="نظام إدارة المبيعات والرواتب — دينار عراقي" />
    <title>نظام المبيعات والرواتب</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="المبيعات" />
    <meta name="application-name" content="المبيعات" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
    <script>
      // apply cached theme before first paint (no flash)
      try { var p = JSON.parse(localStorage.getItem('salesapp-prefs') || '{}'); var d = document.documentElement;
        if (p.theme === 'light' || (p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) d.dataset.theme = 'light';
        if (p.lang === 'en') { d.lang = 'en'; d.dir = 'ltr'; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>يتطلب هذا التطبيق تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
